[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slopfactor-pipeline"
version = "0.1.0"
description = "Review-first arXiv discovery and structural analysis for Slop Factor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/slopfactor"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

