name: Prepare approved paper
run-name: Publish candidate ${{ inputs.candidate_repository }}#${{ inputs.candidate_issue }}

on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Private candidate queue repository
        required: true
        type: string
      candidate_issue:
        description: Private pending candidate issue number
        required: true
        type: string
      candidate_payload:
        description: Human-confirmed candidate payload
        required: true
        type: string
      reviewer:
        description: Accountable reviewer handle
        required: true
        type: string
      evidence_index:
        description: Confirmed disclosure passage number
        required: true
        type: string
      classification:
        description: Confirmed disclosure classification
        required: true
        type: string
      multiplier:
        description: Confirmed disclosure multiplier
        required: true
        type: string
      quotation:
        description: Exact confirmed quotation
        required: true
        type: string
      location_kind:
        description: page or metadata
        required: true
        type: string
      location_value:
        description: Exact confirmed location
        required: true
        type: string
      page:
        description: PDF page number; blank for metadata
        required: false
        type: string
      confirmation:
        description: Must equal APPROVE
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: approve-candidate-${{ inputs.candidate_issue }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install approval tooling
        run: python -m pip install -e .

      - name: Publish approved record
        env:
          CANDIDATE_PAYLOAD: ${{ inputs.candidate_payload }}
          REVIEWER: ${{ inputs.reviewer }}
          EVIDENCE_INDEX: ${{ inputs.evidence_index }}
          CLASSIFICATION: ${{ inputs.classification }}
          MULTIPLIER: ${{ inputs.multiplier }}
          QUOTATION: ${{ inputs.quotation }}
          LOCATION_KIND: ${{ inputs.location_kind }}
          LOCATION_VALUE: ${{ inputs.location_value }}
          PAGE: ${{ inputs.page }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in $(seq 1 40); do
            git fetch origin main
            git reset --hard origin/main
            rm -f private/approval-result.json

            PAGE_ARGUMENTS=()
            if [[ -n "${PAGE}" ]]; then
              PAGE_ARGUMENTS=(--page "${PAGE}")
            fi
            python scripts/approve_issue_candidate.py \
              --candidate-payload "${CANDIDATE_PAYLOAD}" \
              --reviewer "${REVIEWER}" \
              --evidence-index "${EVIDENCE_INDEX}" \
              --classification "${CLASSIFICATION}" \
              --multiplier "${MULTIPLIER}" \
              --quotation "${QUOTATION}" \
              --location-kind "${LOCATION_KIND}" \
              --location-value "${LOCATION_VALUE}" \
              --confirmation "${CONFIRMATION}" \
              --result private/approval-result.json \
              "${PAGE_ARGUMENTS[@]}"
            python scripts/validate_approved.py

            CANDIDATE_ID=$(python -c 'import json; data=json.load(open("private/approval-result.json")); print(data["candidate_id"].rsplit("v", 1)[0].replace("/", "-"))')
            git add -- data/approved/papers.json
            if git diff --cached --quiet; then
              echo "arXiv ${CANDIDATE_ID} is already published."
              exit 0
            fi
            git commit -m "data: add verified arXiv ${CANDIDATE_ID}"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced during approval; retrying (${ATTEMPT}/40)."
            sleep $((1 + RANDOM % 5))
          done
          echo "Could not publish after 40 conflict retries." >&2
          exit 1
