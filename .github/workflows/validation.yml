name: Validation

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate approved data
        run: python scripts/validate_approved.py

      - name: Check Python lint and formatting
        run: |
          ruff check pipeline scripts tests/python
          ruff format --check pipeline scripts tests/python

      - name: Run Python tests
        run: pytest

      - name: Check frontend formatting
        run: npm run format

      - name: Lint and type-check frontend
        run: |
          npm run lint
          npm run check
          npm run check:admin

      - name: Run frontend tests
        run: npm test

      - name: Build production site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
