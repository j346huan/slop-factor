<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>Administrator · Slop Factor</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead">
      <div class="shell masthead__inner">
        <p class="wordmark">Slop Factor</p>
        <div id="account" class="account" hidden>
          <button id="logout" class="text-button" type="button">
            Sign out
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="shell">
      <section
        id="login-panel"
        class="login-panel"
        aria-label="Administrator sign in"
        hidden
      >
        <a class="button" href="/auth/start">Sign in with GitHub</a>
      </section>

      <div id="dashboard" hidden>
        <div
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <section class="toolbar" aria-label="Scan and queue controls">
          <form id="scan-form" class="scan-form">
            <label>
              Release from
              <input
                id="scan-start-date"
                name="startDate"
                type="date"
                required
              />
            </label>
            <label>
              Release to
              <input id="scan-end-date" name="endDate" type="date" required />
            </label>
            <details class="scan-history">
              <summary>
                Next unscanned: <strong id="next-unscanned">—</strong>
              </summary>
              <p>Latest release: <strong id="latest-arxiv-date">—</strong></p>
              <p id="scanned-dates">No completed dates.</p>
            </details>
            <button
              id="refresh-available"
              class="secondary-button"
              type="button"
            >
              Refresh dates
            </button>
            <button class="button" type="submit">Scan</button>
          </form>
        </section>

        <section id="scan-session" class="scan-session" hidden>
          <div class="scan-session__header">
            <strong id="scan-stage">Waiting</strong>
            <span id="scan-percent">0%</span>
          </div>
          <progress id="scan-progress" max="1"></progress>
          <dl class="scan-metrics">
            <div>
              <dt>Total</dt>
              <dd id="scan-total">—</dd>
            </div>
            <div>
              <dt>Processed</dt>
              <dd id="scan-processed">0</dd>
            </div>
            <div>
              <dt>Candidates</dt>
              <dd id="scan-candidates">0</dd>
            </div>
            <div>
              <dt>Errors</dt>
              <dd id="scan-errors">0</dd>
            </div>
          </dl>
          <p id="scan-current" class="scan-current"></p>
        </section>

        <section class="stats" aria-label="Candidate queue statistics">
          <article>
            <span id="pending-count">0</span>
            <p>Pending</p>
          </article>
          <article>
            <span id="submitted-count">0</span>
            <p>Publishing</p>
          </article>
          <article>
            <span id="rejected-count">0</span>
            <p>Rejected</p>
          </article>
          <article>
            <span id="approved-count">0</span>
            <p>Approved</p>
          </article>
        </section>

        <section class="queue" aria-label="Candidate papers">
          <div class="panel-heading">
            <div class="decision-controls">
              <button
                id="export-pending"
                class="secondary-button"
                type="button"
              >
                Output pending
              </button>
              <input
                id="decision-file"
                class="visually-hidden"
                type="file"
                accept="application/json,.json"
              />
              <button
                id="import-decisions"
                class="secondary-button"
                type="button"
              >
                Input decisions
              </button>
            </div>
            <div class="queue-controls">
              <label>
                <span class="visually-hidden">Search candidates</span>
                <input
                  id="search"
                  type="search"
                  placeholder="Search title, author, or arXiv ID"
                />
              </label>
              <label>
                <span class="visually-hidden">Filter status</span>
                <select id="status-filter">
                  <option value="pending">Pending</option>
                  <option value="approval-submitted">Publishing</option>
                  <option value="rejected">Rejected</option>
                  <option value="approved">Approved</option>
                  <option value="all">All statuses</option>
                </select>
              </label>
            </div>
          </div>
          <div id="candidate-list" class="candidate-list"></div>
          <p id="empty-state" class="empty-state" hidden>
            No candidates match the current filters.
          </p>
        </section>
      </div>
    </main>

    <dialog id="review-dialog" class="review-dialog">
      <form method="dialog" class="dialog-header">
        <h2 id="review-title">Review candidate</h2>
        <button class="close-button" value="cancel" aria-label="Close review">
          ×
        </button>
      </form>
      <div id="review-content"></div>
    </dialog>
  </body>
</html>
